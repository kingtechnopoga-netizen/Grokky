# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys two services:
#   1. grokky-api  — Node web service that proxies Anthropic Claude calls.
#                    The Anthropic API key lives ONLY here, as a secret env var.
#   2. grokky      — the static single-page app.
#
# After first deploy, in the Render dashboard:
#   - Open the "grokky-api" service → Environment → set ANTHROPIC_API_KEY.
#   - Copy the service's URL (e.g. https://grokky-api.onrender.com) and
#     either edit the <meta name="grokky-api"> tag in index.html OR open
#     the deployed site, click the gear icon, and paste the URL there.

services:
  # ---------- Backend: Anthropic proxy ----------
  - type: web
    name: grokky-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false              # mark as secret — set manually in the dashboard
      - key: ALLOWED_ORIGINS
        value: "*"               # tighten this once you know your static site's URL
      - key: CLAUDE_MODEL
        value: claude-3-5-haiku-latest

  # ---------- Frontend: static site ----------
  - type: web
    name: grokky
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
