<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grokky — Free Grok via Puter.js</title>
  <!-- Puter.js: https://developer.puter.com/tutorials/free-unlimited-grok-api/ -->
  <script src="https://js.puter.com/v2/"></script>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0d10;
      color: #e7e9ea;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 20px;
      border-bottom: 1px solid #20262d;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header select {
      margin-left: auto;
      background: #161a1f;
      color: #e7e9ea;
      border: 1px solid #2a313a;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 12px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .msg.user      { background: #1d4ed8; color: white; align-self: flex-end; max-width: 80%; margin-left: auto; }
    .msg.assistant { background: #161a1f; border: 1px solid #2a313a; }
    .msg.error     { background: #3a1414; border: 1px solid #7f1d1d; color: #fecaca; }
    .role { font-size: 11px; opacity: 0.6; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      border-top: 1px solid #20262d;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }
    input[type=text] {
      flex: 1;
      background: #161a1f;
      color: #e7e9ea;
      border: 1px solid #2a313a;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
    }
    button {
      background: #1d4ed8;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <h1>Grokky</h1>
    <select id="model">
      <option value="x-ai/grok-4.3">grok-4.3</option>
      <option value="x-ai/grok-4-1-fast">grok-4-1-fast</option>
      <option value="x-ai/grok-3">grok-3</option>
      <option value="x-ai/grok-3-mini">grok-3-mini</option>
      <option value="x-ai/grok-2">grok-2</option>
    </select>
  </header>

  <div id="log"></div>

  <form id="form">
    <input id="input" type="text" placeholder="Ask Grok anything…" autocomplete="off" autofocus />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const log    = document.getElementById('log');
    const form   = document.getElementById('form');
    const input  = document.getElementById('input');
    const send   = document.getElementById('send');
    const modelEl = document.getElementById('model');

    // Multi-turn conversation history (Example 3 from the tutorial)
    const history = [];

    function addMsg(role, text = '') {
      const el = document.createElement('div');
      el.className = `msg ${role}`;
      el.innerHTML = `<div class="role">${role}</div><div class="body"></div>`;
      el.querySelector('.body').textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el.querySelector('.body');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      send.disabled = true;
      addMsg('user', text);
      history.push({ role: 'user', content: text });

      const out = addMsg('assistant', '');
      let full = '';

      try {
        // Streaming chat — Example 2 from the tutorial
        const response = await puter.ai.chat(history, {
          model: modelEl.value,
          stream: true,
        });

        for await (const part of response) {
          if (part?.text) {
            full += part.text;
            out.textContent = full;
            log.scrollTop = log.scrollHeight;
          }
        }

        history.push({ role: 'assistant', content: full });
      } catch (err) {
        console.error(err);
        out.parentElement.classList.remove('assistant');
        out.parentElement.classList.add('error');
        out.textContent = `Error: ${err?.message || err}`;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
