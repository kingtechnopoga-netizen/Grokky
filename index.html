<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0b0b12" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="description" content="Grokky — free, unlimited chat & image generation. No signup, no API key." />
  <title>Grokky — Free AI Chat & Images</title>

  <!--
    Optional Claude prompt-enhancer backend.
    Leave content="" to disable. After deploying server/ on Render, paste the
    URL here, e.g.: <meta name="grokky-api" content="https://grokky-api.onrender.com">
    Users can also override at runtime via the gear icon in the header.
  -->
  <meta name="grokky-api" content="" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1' y1='0' y2='1'%3E%3Cstop offset='0' stop-color='%237c3aed'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='50%25' y='56%25' text-anchor='middle' font-family='system-ui,sans-serif' font-size='38' font-weight='800' fill='white'%3EG%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://image.pollinations.ai" crossorigin>
  <link rel="preconnect" href="https://text.pollinations.ai" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Markdown + sanitization + code highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css" id="hljs-theme">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/lib/common.min.js"></script>

  <!--
    Backend: Pollinations.ai — open-source, keyless, anonymous-tier free.
      Chat:  https://text.pollinations.ai/openai      (OpenAI-compatible)
      Image: https://image.pollinations.ai/prompt/{prompt}
    Docs:    https://pollinations.ai
  -->

  <style>
    /* ------------ Tokens ------------ */
    :root {
      --brand-1: #7c3aed;
      --brand-2: #ec4899;
      --brand-3: #06b6d4;
      --radius-lg: 22px;
      --transition: 180ms cubic-bezier(.2,.7,.3,1);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    [data-theme="dark"] {
      --bg: #0b0b12; --bg-elev: #11121b;
      --surface: rgba(255,255,255,0.04); --surface-2: rgba(255,255,255,0.07);
      --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.14);
      --text: #ececf1; --text-dim: #9ca3af; --text-faint: #6b7280;
      --user-bg: linear-gradient(135deg, var(--brand-1), var(--brand-2));
      --code-bg: rgba(0,0,0,0.35);
      --shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }
    [data-theme="light"] {
      --bg: #fafafa; --bg-elev: #ffffff;
      --surface: rgba(0,0,0,0.03); --surface-2: rgba(0,0,0,0.05);
      --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.16);
      --text: #0f172a; --text-dim: #475569; --text-faint: #94a3b8;
      --user-bg: linear-gradient(135deg, var(--brand-1), var(--brand-2));
      --code-bg: rgba(0,0,0,0.04);
      --shadow: 0 10px 30px -12px rgba(0,0,0,0.18);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: var(--font);
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow: hidden; overscroll-behavior: none;
    }
    body::before {
      content: ''; position: fixed; inset: -20%; z-index: -1;
      background:
        radial-gradient(40rem 30rem at 15% 10%, rgba(124,58,237,0.18), transparent 60%),
        radial-gradient(35rem 25rem at 85% 90%, rgba(236,72,153,0.14), transparent 60%),
        radial-gradient(30rem 25rem at 50% 50%, rgba(6,182,212,0.08), transparent 60%);
      filter: blur(40px); pointer-events: none;
    }
    [data-theme="light"] body::before { opacity: 0.55; }

    .app {
      display: flex; flex-direction: column;
      height: 100dvh; max-width: 920px; margin: 0 auto;
      padding: 0 max(env(safe-area-inset-left), 12px) 0 max(env(safe-area-inset-right), 12px);
    }

    header {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 4px; padding-top: max(env(safe-area-inset-top), 14px);
      position: sticky; top: 0; z-index: 5;
      background: linear-gradient(to bottom, var(--bg) 70%, transparent);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
    .logo {
      width: 32px; height: 32px; border-radius: 9px;
      background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
      display: grid; place-items: center;
      color: white; font-weight: 800; font-size: 17px;
      box-shadow: 0 4px 14px -2px rgba(124,58,237,0.5);
    }
    .pill {
      font-size: 11px; padding: 3px 8px; border-radius: 999px;
      background: var(--surface-2); color: var(--text-dim);
      border: 1px solid var(--border); font-weight: 500;
    }
    .actions { margin-left: auto; display: flex; gap: 6px; }
    .icon-btn {
      width: 38px; height: 38px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text); cursor: pointer;
      display: grid; place-items: center;
      transition: all var(--transition);
    }
    .icon-btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
    .icon-btn:active { transform: scale(0.94); }
    .icon-btn svg { width: 18px; height: 18px; }

    #log {
      flex: 1; overflow-y: auto; padding: 8px 4px 24px;
      scroll-behavior: smooth;
      scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent;
    }
    #log::-webkit-scrollbar { width: 8px; }
    #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

    .empty {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 20px; gap: 18px;
    }
    .empty .logo { width: 64px; height: 64px; font-size: 32px; border-radius: 18px; box-shadow: 0 14px 40px -10px rgba(124,58,237,0.6); }
    .empty h2 {
      font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin: 0;
      background: linear-gradient(135deg, var(--brand-1), var(--brand-2), var(--brand-3));
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .empty p { color: var(--text-dim); margin: 0; max-width: 360px; line-height: 1.5; }
    .suggestions {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 8px; width: 100%; max-width: 560px; margin-top: 10px;
    }
    .suggestion {
      text-align: left; padding: 12px 14px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      cursor: pointer; font: inherit; font-size: 13px; line-height: 1.4;
      transition: all var(--transition);
    }
    .suggestion:hover { background: var(--surface-2); border-color: var(--border-strong); transform: translateY(-1px); }
    .suggestion strong { display: block; margin-bottom: 2px; font-weight: 600; }
    .suggestion span { color: var(--text-dim); }

    .msg { max-width: 100%; margin: 0 0 14px; animation: fade-in 200ms ease-out; }
    @keyframes fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .msg .meta {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: var(--text-faint); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600;
    }
    .msg.user .meta { justify-content: flex-end; }
    .msg.user .bubble {
      margin-left: auto; background: var(--user-bg); color: white;
      border-bottom-right-radius: 6px; max-width: 85%;
      box-shadow: 0 6px 24px -8px rgba(124,58,237,0.5);
    }
    .msg.assistant .bubble {
      background: var(--surface); border: 1px solid var(--border);
      border-bottom-left-radius: 6px; max-width: 100%;
    }
    .msg.error .bubble { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .bubble { padding: 12px 16px; border-radius: var(--radius-lg); width: fit-content; word-wrap: break-word; line-height: 1.55; font-size: 15px; }
    .bubble p { margin: 0 0 10px; } .bubble p:last-child { margin-bottom: 0; }
    .bubble pre {
      background: var(--code-bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; overflow-x: auto; margin: 10px 0; position: relative;
      font-family: var(--mono); font-size: 13px; line-height: 1.5;
    }
    .bubble code:not(pre code) {
      background: var(--code-bg); padding: 1px 6px; border-radius: 5px;
      font-family: var(--mono); font-size: 0.88em; border: 1px solid var(--border);
    }
    .msg.user .bubble code:not(pre code) { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.2); }
    .bubble pre code { background: none; border: 0; padding: 0; }
    .bubble ul, .bubble ol { padding-left: 22px; margin: 8px 0; }
    .bubble li { margin: 3px 0; }
    .bubble h1, .bubble h2, .bubble h3 { margin: 14px 0 8px; line-height: 1.3; }
    .bubble h1 { font-size: 20px; } .bubble h2 { font-size: 17px; } .bubble h3 { font-size: 15px; }
    .bubble a { color: var(--brand-3); text-decoration: underline; text-underline-offset: 2px; }
    .msg.user .bubble a { color: white; }
    .bubble blockquote { border-left: 3px solid var(--brand-1); padding: 4px 0 4px 12px; color: var(--text-dim); margin: 8px 0; }
    .bubble table { border-collapse: collapse; margin: 10px 0; font-size: 14px; }
    .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }

    .code-wrap { position: relative; }
    .copy-code {
      position: absolute; top: 6px; right: 6px;
      padding: 4px 9px; font-size: 11px; font-weight: 500;
      border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg-elev); color: var(--text-dim);
      cursor: pointer; opacity: 0; transition: all var(--transition);
    }
    .code-wrap:hover .copy-code, .copy-code:focus-visible { opacity: 1; }
    .copy-code:hover { color: var(--text); border-color: var(--border-strong); }
    .copy-code.ok { color: #34d399; border-color: rgba(52,211,153,0.4); }

    .msg-actions { display: flex; gap: 4px; margin-top: 6px; opacity: 0; transition: opacity var(--transition); }
    .msg:hover .msg-actions, .msg-actions:focus-within { opacity: 1; }
    @media (hover: none) { .msg-actions { opacity: 1; } }
    .msg-action {
      padding: 5px 9px; font-size: 12px; border-radius: 7px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-dim); cursor: pointer;
      transition: all var(--transition); font-family: inherit;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .msg-action:hover { color: var(--text); background: var(--surface); }
    .msg-action.ok { color: #34d399; }
    .msg-action svg { width: 12px; height: 12px; }

    .caret {
      display: inline-block; width: 7px; height: 16px;
      vertical-align: text-bottom; background: currentColor;
      margin-left: 2px; animation: blink 1s steps(1) infinite; border-radius: 1px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .thinking { display: inline-flex; gap: 4px; padding: 4px 0; }
    .thinking span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--text-dim);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .thinking span:nth-child(2) { animation-delay: 0.15s; }
    .thinking span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-5px); opacity: 1; } }

    .composer-wrap {
      position: sticky; bottom: 0;
      padding: 10px 0 max(env(safe-area-inset-bottom), 12px);
      background: linear-gradient(to top, var(--bg) 70%, transparent);
    }
    .composer {
      display: flex; align-items: flex-end; gap: 8px;
      padding: 8px 8px 8px 14px;
      background: var(--bg-elev); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow);
      transition: border-color var(--transition);
    }
    .composer:focus-within { border-color: var(--brand-1); box-shadow: 0 0 0 3px rgba(124,58,237,0.15), var(--shadow); }
    #input {
      flex: 1; background: transparent; border: 0; color: var(--text);
      font: inherit; font-size: 16px; line-height: 1.5;
      resize: none; outline: none; max-height: 200px;
      padding: 8px 0; overflow-y: auto; scrollbar-width: thin;
    }
    #input::placeholder { color: var(--text-faint); }
    .send-btn {
      width: 40px; height: 40px; flex-shrink: 0;
      border-radius: 12px; border: 0;
      background: linear-gradient(135deg, var(--brand-1), var(--brand-2));
      color: white; cursor: pointer;
      display: grid; place-items: center;
      transition: all var(--transition);
      box-shadow: 0 4px 14px -2px rgba(124,58,237,0.5);
    }
    .send-btn:hover:not(:disabled) { transform: translateY(-1px); }
    .send-btn:active:not(:disabled) { transform: scale(0.94); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    .send-btn svg { width: 18px; height: 18px; }
    .send-btn.stop { background: #ef4444; box-shadow: 0 4px 14px -2px rgba(239,68,68,0.5); }

    .mode-btn {
      width: 36px; height: 36px; flex-shrink: 0;
      border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text-dim);
      cursor: pointer; display: grid; place-items: center;
      transition: all var(--transition);
      align-self: flex-end; margin-bottom: 2px;
    }
    .mode-btn:hover { background: var(--surface-2); color: var(--text); }
    .mode-btn[aria-pressed="true"] {
      background: linear-gradient(135deg, rgba(124,58,237,0.18), rgba(236,72,153,0.18));
      border-color: var(--brand-1); color: var(--brand-2);
    }
    .mode-btn svg { width: 18px; height: 18px; }
    .enhance-btn[aria-pressed="true"] {
      background: linear-gradient(135deg, rgba(245,158,11,0.20), rgba(236,72,153,0.18));
      border-color: #f59e0b; color: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245,158,11,0.18);
    }
    .composer.image-mode { border-color: var(--brand-2); }
    .composer.image-mode:focus-within { box-shadow: 0 0 0 3px rgba(236,72,153,0.18), var(--shadow); }

    .enhance-info {
      font-size: 12px; color: var(--text-dim);
      background: var(--surface); border: 1px solid var(--border);
      border-left: 3px solid #f59e0b;
      padding: 8px 12px; border-radius: 8px;
      margin-bottom: 8px; line-height: 1.5;
    }
    .enhance-info strong { color: #f59e0b; font-weight: 600; }
    .enhance-info .orig { color: var(--text-faint); font-style: italic; }

    .gen-image-wrap { display: inline-block; max-width: 100%; }
    .gen-image {
      display: block; max-width: 100%; max-height: 480px;
      border-radius: 12px; border: 1px solid var(--border);
      background: var(--code-bg);
    }
    .gen-image-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .gen-image-actions a, .gen-image-actions button {
      padding: 6px 10px; font-size: 12px; border-radius: 7px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-dim); cursor: pointer;
      font-family: inherit; text-decoration: none;
      display: inline-flex; align-items: center; gap: 5px;
      transition: all var(--transition);
    }
    .gen-image-actions a:hover, .gen-image-actions button:hover {
      color: var(--text); background: var(--surface); border-color: var(--border-strong);
    }
    .gen-image-actions svg { width: 12px; height: 12px; }
    .gen-image-actions .ok { color: #34d399; }
    .gen-caption { color: var(--text-dim); font-size: 13px; margin-top: 8px; font-style: italic; }

    .footer-hint {
      text-align: center; font-size: 11px;
      color: var(--text-faint); margin-top: 6px;
    }
    .footer-hint a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .kbd {
      font-family: var(--mono); font-size: 10px;
      padding: 1px 5px; border-radius: 4px;
      background: var(--surface); border: 1px solid var(--border);
    }

    .toast {
      position: fixed; left: 50%; bottom: 90px;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg-elev); color: var(--text);
      border: 1px solid var(--border-strong);
      padding: 10px 16px; border-radius: 10px; font-size: 13px;
      box-shadow: var(--shadow); opacity: 0; pointer-events: none;
      transition: all var(--transition); z-index: 50;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 640px) {
      header { padding: 10px 2px; }
      .brand { font-size: 16px; }
      .logo { width: 28px; height: 28px; font-size: 15px; border-radius: 8px; }
      .pill { display: none; }
      .empty h2 { font-size: 24px; }
      .bubble { font-size: 15px; padding: 11px 14px; }
      .icon-btn { width: 36px; height: 36px; }
      .mode-btn { width: 34px; height: 34px; }
      .gen-image { max-height: 360px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo">G</div>
        <span>Grokky</span>
        <span class="pill" id="status-pill">free · no signup</span>
      </div>
      <div class="actions">
        <button class="icon-btn" id="settings-btn" aria-label="Backend settings" title="Configure Claude enhancer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
        <button class="icon-btn" id="theme-btn" aria-label="Toggle theme" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button class="icon-btn" id="clear-btn" aria-label="New chat" title="New chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <div id="log" role="log" aria-live="polite" aria-atomic="false"></div>

    <div class="composer-wrap">
      <form class="composer" id="form">
        <button type="button" class="mode-btn" id="mode-btn" aria-pressed="false" aria-label="Toggle image mode" title="Toggle image mode">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
        </button>
        <button type="button" class="mode-btn enhance-btn" id="enhance-btn" aria-pressed="false" aria-label="Toggle Claude prompt enhancer" title="Enhance prompt with Claude (image mode only)" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Message…" autocomplete="off" autocapitalize="sentences" spellcheck="true" enterkeyhint="send" aria-label="Message"></textarea>
        <button class="send-btn" id="send" type="submit" aria-label="Send">
          <svg id="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14-7-7 14-2-5-5-2z"/></svg>
        </button>
      </form>
      <div class="footer-hint" id="footer-hint">
        <span class="kbd">Enter</span> to send · <span class="kbd">Shift+Enter</span> newline · powered by <a href="https://pollinations.ai" target="_blank" rel="noopener">Pollinations.ai</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    /* ============== Config ============== */
    // Pollinations.ai — open-source AI APIs, no key required for the anonymous tier.
    const CHAT_ENDPOINT  = 'https://text.pollinations.ai/openai';
    const CHAT_MODEL     = 'openai-fast'; // GPT-OSS 20B reasoning, the free anonymous-tier model
    const IMAGE_ENDPOINT = 'https://image.pollinations.ai/prompt/';

    // Optional Claude prompt-enhancer backend. Resolved in this order:
    //   1. localStorage override (set via the gear icon)
    //   2. <meta name="grokky-api" content="...">  (edit before deploying)
    //   3. http://localhost:10000 if running locally
    //   4. empty string -> enhancer disabled, app still works without it
    function resolveApiBase() {
      const ls = (localStorage.getItem('grokky.apiBase') || '').trim();
      if (ls) return ls.replace(/\/+$/, '');
      const meta = (document.querySelector('meta[name="grokky-api"]')?.content || '').trim();
      if (meta) return meta.replace(/\/+$/, '');
      const host = location.hostname;
      if (host === 'localhost' || host === '127.0.0.1') return 'http://localhost:10000';
      return '';
    }
    let API_BASE = resolveApiBase();

    const STORAGE_KEYS = {
      history: 'grokky.history.v2',
      theme:   'grokky.theme.v2',
      mode:    'grokky.mode.v2',
      enhance: 'grokky.enhance.v1',
      apiBase: 'grokky.apiBase',
    };

    /* ============== Elements ============== */
    const log         = document.getElementById('log');
    const form        = document.getElementById('form');
    const input       = document.getElementById('input');
    const sendBtn     = document.getElementById('send');
    const sendIcon    = document.getElementById('send-icon');
    const clearBtn    = document.getElementById('clear-btn');
    const themeBtn    = document.getElementById('theme-btn');
    const settingsBtn = document.getElementById('settings-btn');
    const modeBtn     = document.getElementById('mode-btn');
    const enhanceBtn  = document.getElementById('enhance-btn');
    const composer    = document.querySelector('.composer');
    const footerHint  = document.getElementById('footer-hint');
    const toastEl     = document.getElementById('toast');

    /* ============== State ============== */
    let history = [];
    let abortCtrl = null;     // AbortController for the in-flight chat request
    let mode = 'chat';        // 'chat' | 'image'
    let enhanceOn = localStorage.getItem(STORAGE_KEYS.enhance) === '1';

    /* ============== Markdown ============== */
    marked.setOptions({ breaks: true, gfm: true });

    function renderMarkdown(md) {
      const html  = marked.parse(md || '');
      const clean = DOMPurify.sanitize(html, { ADD_ATTR: ['target', 'rel'] });
      const tpl   = document.createElement('template');
      tpl.innerHTML = clean.trim();

      tpl.content.querySelectorAll('pre').forEach(pre => {
        const wrap = document.createElement('div');
        wrap.className = 'code-wrap';
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);

        const btn = document.createElement('button');
        btn.className = 'copy-code'; btn.type = 'button'; btn.textContent = 'Copy';
        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(pre.innerText);
            btn.textContent = 'Copied'; btn.classList.add('ok');
            setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('ok'); }, 1500);
          } catch { showToast('Copy failed'); }
        });
        wrap.appendChild(btn);

        const code = pre.querySelector('code');
        if (code && window.hljs) { try { window.hljs.highlightElement(code); } catch {} }
      });

      tpl.content.querySelectorAll('a').forEach(a => {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
      });
      return tpl.content;
    }

    /* ============== Toast ============== */
    let toastTimer;
    function showToast(text) {
      toastEl.textContent = text; toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
    }

    /* ============== Theme ============== */
    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('hljs-theme').href = theme === 'light'
        ? 'https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css'
        : 'https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css';
      localStorage.setItem(STORAGE_KEYS.theme, theme);
    }
    themeBtn.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
    });
    (() => {
      const saved = localStorage.getItem(STORAGE_KEYS.theme);
      if (saved) applyTheme(saved);
      else if (window.matchMedia?.('(prefers-color-scheme: light)').matches) applyTheme('light');
    })();

    /* ============== Mode (chat ↔ image) ============== */
    function applyMode(next) {
      mode = next;
      const isImage = mode === 'image';
      modeBtn.setAttribute('aria-pressed', String(isImage));
      composer.classList.toggle('image-mode', isImage);
      enhanceBtn.hidden = !isImage;     // enhancer only makes sense for images
      input.placeholder = isImage ? 'Describe an image to generate…' : 'Message…';
      updateFooterHint();
      localStorage.setItem(STORAGE_KEYS.mode, mode);
    }
    function updateFooterHint() {
      const isImage = mode === 'image';
      const enhBit = isImage && enhanceOn && API_BASE
        ? ' · <strong style="color:#f59e0b">✨ Claude enhance on</strong>'
        : '';
      footerHint.innerHTML = isImage
        ? 'Image mode · <span class="kbd">Enter</span> to generate' + enhBit + ' · powered by <a href="https://pollinations.ai" target="_blank" rel="noopener">Pollinations.ai</a>'
        : '<span class="kbd">Enter</span> to send · <span class="kbd">Shift+Enter</span> newline · powered by <a href="https://pollinations.ai" target="_blank" rel="noopener">Pollinations.ai</a>';
    }
    modeBtn.addEventListener('click', () => applyMode(mode === 'image' ? 'chat' : 'image'));
    (() => {
      const saved = localStorage.getItem(STORAGE_KEYS.mode);
      if (saved === 'image') applyMode('image'); else applyMode('chat');
    })();

    /* ============== Claude enhancer toggle ============== */
    function applyEnhance(next) {
      enhanceOn = next;
      enhanceBtn.setAttribute('aria-pressed', String(enhanceOn));
      localStorage.setItem(STORAGE_KEYS.enhance, enhanceOn ? '1' : '0');
      updateFooterHint();
    }
    enhanceBtn.setAttribute('aria-pressed', String(enhanceOn));
    enhanceBtn.addEventListener('click', () => {
      // If the user is enabling the enhancer but no backend is configured,
      // walk them through setting one up rather than failing silently later.
      if (!enhanceOn && !API_BASE) {
        const ok = confirm(
          'The Claude prompt enhancer needs a backend URL.\n\n' +
          'Deploy the server/ folder on Render, then paste its URL (e.g. https://grokky-api.onrender.com) on the next prompt.'
        );
        if (!ok) return;
        if (!promptForApiBase()) return;
      }
      applyEnhance(!enhanceOn);
    });

    /* ============== Backend settings (gear icon) ============== */
    function promptForApiBase() {
      const current = localStorage.getItem(STORAGE_KEYS.apiBase) || API_BASE || '';
      const next = window.prompt(
        'Claude enhancer backend URL\n\n' +
        'Paste the URL of your deployed grokky-api service.\n' +
        'Leave empty to clear and disable the enhancer.\n\n' +
        'Example: https://grokky-api.onrender.com',
        current
      );
      if (next === null) return false;             // user cancelled
      const trimmed = next.trim().replace(/\/+$/, '');
      if (!trimmed) {
        localStorage.removeItem(STORAGE_KEYS.apiBase);
        API_BASE = resolveApiBase();
        if (enhanceOn) applyEnhance(false);
        showToast('Enhancer backend cleared');
        updateFooterHint();
        return false;
      }
      if (!/^https?:\/\//i.test(trimmed)) {
        showToast('URL must start with http:// or https://');
        return false;
      }
      localStorage.setItem(STORAGE_KEYS.apiBase, trimmed);
      API_BASE = trimmed;
      showToast('Saved. Testing connection…');
      // Best-effort health check, just to give the user feedback.
      fetch(API_BASE + '/healthz', { mode: 'cors' })
        .then((r) => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
        .then((j) => showToast(j.hasKey ? 'Backend OK' : 'Backend reachable but ANTHROPIC_API_KEY missing'))
        .catch((err) => showToast('Backend unreachable: ' + (err.message || err)));
      updateFooterHint();
      return true;
    }
    settingsBtn.addEventListener('click', () => promptForApiBase());

    /* ============== Empty state / suggestions ============== */
    const SUGGESTIONS = [
      { title: 'Explain a concept',  sub: 'Quantum computing — like I\'m 12' },
      { title: 'Write code',         sub: 'Debounce in TypeScript with tests' },
      { title: 'Brainstorm',         sub: '5 startup ideas that ship in a weekend' },
      { title: 'Generate an image',  sub: 'Tap the picture icon, then describe it', mode: 'image', prompt: 'A neon cyberpunk cat coding on a laptop, vaporwave palette' },
    ];

    function renderEmpty() {
      log.innerHTML = '';
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `
        <div class="logo">G</div>
        <h2>Free chat & image AI</h2>
        <p>No signup, no API key. Powered by Pollinations.ai's open-source models.</p>
        <div class="suggestions"></div>
      `;
      const grid = empty.querySelector('.suggestions');
      SUGGESTIONS.forEach(s => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'suggestion';
        b.innerHTML = `<strong>${s.title}</strong><span>${s.sub}</span>`;
        b.addEventListener('click', () => {
          if (s.mode) applyMode(s.mode);
          input.value = s.prompt || `${s.title}: ${s.sub}`;
          autosize(); input.focus();
        });
        grid.appendChild(b);
      });
      log.appendChild(empty);
    }

    /* ============== Message rendering ============== */
    function addMsg(role, content = '') {
      const empty = log.querySelector('.empty');
      if (empty) empty.remove();

      const wrap = document.createElement('div');
      wrap.className = `msg ${role}`;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = role === 'user' ? 'You' : (role === 'error' ? 'Error' : 'AI');
      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (role === 'user') {
        bubble.textContent = content;
      } else if (role === 'assistant') {
        if (content) bubble.appendChild(renderMarkdown(content));
        else bubble.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
      } else {
        bubble.textContent = content;
      }

      wrap.appendChild(meta);
      wrap.appendChild(bubble);

      if (role === 'assistant') {
        const actions = document.createElement('div');
        actions.className = 'msg-actions';
        actions.innerHTML = `
          <button class="msg-action" data-act="copy" title="Copy">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            Copy
          </button>
          <button class="msg-action" data-act="regenerate" title="Regenerate">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            Retry
          </button>
        `;
        wrap.appendChild(actions);
      }

      log.appendChild(wrap);
      scrollToBottom();
      return bubble;
    }

    function scrollToBottom(smooth = true) {
      log.scrollTo({ top: log.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
    }
    function isAtBottom() {
      return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    }

    /* ============== History persistence ============== */
    function saveHistory() {
      try { localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(history)); } catch {}
    }
    function loadHistory() {
      try {
        const raw = localStorage.getItem(STORAGE_KEYS.history);
        return raw ? JSON.parse(raw) : [];
      } catch { return []; }
    }
    function rerenderAll() {
      log.innerHTML = '';
      if (!history.length) { renderEmpty(); return; }
      for (const m of history) {
        if (m.role === 'user' || m.role === 'assistant') addMsg(m.role, m.content);
      }
      requestAnimationFrame(() => scrollToBottom(false));
    }

    /* ============== Send button state ============== */
    function setBusy(busy) {
      if (busy) {
        sendBtn.classList.add('stop');
        sendBtn.setAttribute('aria-label', 'Stop');
        sendIcon.innerHTML = '<rect x="6" y="6" width="12" height="12" rx="1.5"/>';
      } else {
        sendBtn.classList.remove('stop');
        sendBtn.setAttribute('aria-label', 'Send');
        sendIcon.innerHTML = '<path d="M5 12l14-7-7 14-2-5-5-2z"/>';
      }
    }

    /* ============== Chat (Pollinations OpenAI-compatible) ============== */
    async function sendMessage(text) {
      const trimmed = text.trim();
      if (!trimmed) return;

      history.push({ role: 'user', content: trimmed });
      addMsg('user', trimmed);
      saveHistory();

      const bubble = addMsg('assistant', '');
      let full = '';
      abortCtrl = new AbortController();
      setBusy(true);

      try {
        const res = await fetch(CHAT_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: CHAT_MODEL,
            messages: history,
            stream: true,
          }),
          signal: abortCtrl.signal,
        });

        if (!res.ok || !res.body) {
          throw new Error(`HTTP ${res.status} ${res.statusText}`);
        }

        const reader  = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          // Parse SSE lines: "data: {...}\n\n"
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            const trimmedLine = line.trim();
            if (!trimmedLine.startsWith('data:')) continue;
            const data = trimmedLine.slice(5).trim();
            if (!data || data === '[DONE]') continue;
            try {
              const json = JSON.parse(data);
              const delta = json.choices?.[0]?.delta?.content;
              // Skip "reasoning" deltas (model's internal CoT) — only show final content
              if (typeof delta === 'string' && delta.length) {
                full += delta;
                bubble.innerHTML = '';
                bubble.appendChild(renderMarkdown(full));
                const caret = document.createElement('span');
                caret.className = 'caret';
                bubble.appendChild(caret);
                if (isAtBottom()) scrollToBottom(false);
              }
            } catch { /* ignore malformed lines */ }
          }
        }

        bubble.innerHTML = '';
        bubble.appendChild(renderMarkdown(full || '*(empty response)*'));
        history.push({ role: 'assistant', content: full });
        saveHistory();
      } catch (err) {
        if (err.name === 'AbortError') {
          // User stopped — keep partial text if any
          if (full) {
            bubble.innerHTML = '';
            bubble.appendChild(renderMarkdown(full));
            history.push({ role: 'assistant', content: full });
            saveHistory();
          } else {
            bubble.parentElement.remove();
            history.pop(); // drop the user message we just pushed
            saveHistory();
          }
        } else {
          console.error(err);
          bubble.parentElement.classList.remove('assistant');
          bubble.parentElement.classList.add('error');
          bubble.textContent = humanizeError(err);
          if (history[history.length - 1]?.role === 'user') {
            history.pop();
            saveHistory();
          }
        }
      } finally {
        abortCtrl = null;
        setBusy(false);
        input.focus();
      }
    }

    async function regenerateLast() {
      if (abortCtrl) return;
      const bubble = addMsg('assistant', '');
      let full = '';
      abortCtrl = new AbortController();
      setBusy(true);
      try {
        const res = await fetch(CHAT_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: CHAT_MODEL, messages: history, stream: true }),
          signal: abortCtrl.signal,
        });
        if (!res.ok || !res.body) throw new Error(`HTTP ${res.status}`);
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            const t = line.trim();
            if (!t.startsWith('data:')) continue;
            const data = t.slice(5).trim();
            if (!data || data === '[DONE]') continue;
            try {
              const json = JSON.parse(data);
              const delta = json.choices?.[0]?.delta?.content;
              if (typeof delta === 'string' && delta.length) {
                full += delta;
                bubble.innerHTML = '';
                bubble.appendChild(renderMarkdown(full));
                const caret = document.createElement('span'); caret.className = 'caret';
                bubble.appendChild(caret);
                if (isAtBottom()) scrollToBottom(false);
              }
            } catch {}
          }
        }
        bubble.innerHTML = '';
        bubble.appendChild(renderMarkdown(full || '*(empty)*'));
        history.push({ role: 'assistant', content: full });
        saveHistory();
      } catch (err) {
        bubble.parentElement.classList.remove('assistant');
        bubble.parentElement.classList.add('error');
        bubble.textContent = humanizeError(err);
      } finally {
        abortCtrl = null;
        setBusy(false);
      }
    }

    /* ============== Image generation (Pollinations) ============== */
    // Optional pre-step: ask the Claude backend to expand a short user idea into
    // a richer image-gen prompt. Returns the enhanced prompt or null on failure.
    async function enhanceWithClaude(rawPrompt) {
      if (!API_BASE) return null;
      try {
        const res = await fetch(API_BASE + '/api/enhance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: rawPrompt }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || `HTTP ${res.status}`);
        }
        const json = await res.json();
        return typeof json.enhanced === 'string' && json.enhanced.trim() ? json.enhanced.trim() : null;
      } catch (err) {
        console.warn('[enhance] failed, falling back to raw prompt:', err);
        showToast('Enhancer failed — using your prompt as-is. ' + (err.message || ''));
        return null;
      }
    }

    async function generateImage(promptText) {
      const userPrompt = promptText.trim();
      if (!userPrompt) return;

      addMsg('user', userPrompt);

      const wrapEl = document.createElement('div');
      wrapEl.className = 'msg assistant';
      wrapEl.innerHTML = '<div class="meta">AI Image</div>';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = enhanceOn && API_BASE
        ? '<div class="thinking"><span></span><span></span><span></span></div><div style="margin-top:6px;font-size:12px;color:var(--text-dim)">Asking Claude to enhance your prompt…</div>'
        : '<div class="thinking"><span></span><span></span><span></span></div>';
      wrapEl.appendChild(bubble);
      log.appendChild(wrapEl);
      scrollToBottom();

      // Enhance the prompt via Claude if enabled, else use it raw.
      let finalPrompt = userPrompt;
      let enhanced = null;
      if (enhanceOn && API_BASE) {
        enhanced = await enhanceWithClaude(userPrompt);
        if (enhanced) finalPrompt = enhanced;
      }

      // Pollinations builds images from URL params. Random seed = unique image.
      const seed = Math.floor(Math.random() * 1_000_000_000);
      const params = new URLSearchParams({
        width: '1024', height: '1024', seed: String(seed),
        nologo: 'true', enhance: 'true',
      });
      const url = IMAGE_ENDPOINT + encodeURIComponent(finalPrompt) + '?' + params;

      const img = new Image();
      img.classList.add('gen-image');
      img.alt = finalPrompt;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';

      img.onload = () => {
        bubble.innerHTML = '';

        // If the prompt got enhanced, show both versions above the image.
        if (enhanced && enhanced !== userPrompt) {
          const info = document.createElement('div');
          info.className = 'enhance-info';
          info.innerHTML =
            '<div class="orig"><strong>You:</strong> ' + escapeHtml(userPrompt) + '</div>' +
            '<div style="margin-top:4px"><strong>✨ Claude:</strong> ' + escapeHtml(enhanced) + '</div>';
          bubble.appendChild(info);
        }

        const imgWrap = document.createElement('div');
        imgWrap.className = 'gen-image-wrap';
        imgWrap.appendChild(img);

        const actions = document.createElement('div');
        actions.className = 'gen-image-actions';

        // Download
        const dl = document.createElement('a');
        dl.href = url;
        dl.download = `grokky-${Date.now()}.jpg`;
        dl.target = '_blank'; dl.rel = 'noopener';
        dl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Download`;
        actions.appendChild(dl);

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy URL`;
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(url);
            copyBtn.classList.add('ok');
            copyBtn.lastChild.textContent = 'Copied';
            setTimeout(() => { copyBtn.classList.remove('ok'); copyBtn.lastChild.textContent = 'Copy URL'; }, 1500);
          } catch { showToast('Copy failed'); }
        });
        actions.appendChild(copyBtn);

        const open = document.createElement('a');
        open.href = url; open.target = '_blank'; open.rel = 'noopener';
        open.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Open`;
        actions.appendChild(open);

        const remix = document.createElement('button');
        remix.type = 'button';
        remix.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>New seed`;
        remix.addEventListener('click', () => {
          wrapEl.remove();
          // Use the (already enhanced, if applicable) finalPrompt for new seeds —
          // re-running the enhancer would just give a different prompt, not a remix.
          generateImageFromFinal(userPrompt, finalPrompt, enhanced);
        });
        actions.appendChild(remix);

        imgWrap.appendChild(actions);

        const caption = document.createElement('div');
        caption.className = 'gen-caption';
        caption.textContent = `"${finalPrompt}"`;
        imgWrap.appendChild(caption);

        bubble.appendChild(imgWrap);
        if (isAtBottom()) scrollToBottom(false);
      };

      img.onerror = () => {
        wrapEl.classList.remove('assistant');
        wrapEl.classList.add('error');
        bubble.innerHTML = '';
        bubble.textContent = 'Image generation failed. Pollinations may be busy — try again in a moment, or rephrase your prompt.';
      };

      img.src = url;
    }

    // Re-render the same enhanced prompt with a different seed (used by "New seed").
    function generateImageFromFinal(userPrompt, finalPrompt, enhanced) {
      addMsg('user', userPrompt);
      const wrapEl = document.createElement('div');
      wrapEl.className = 'msg assistant';
      wrapEl.innerHTML = '<div class="meta">AI Image</div>';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.innerHTML = '<div class="thinking"><span></span><span></span><span></span></div>';
      wrapEl.appendChild(bubble);
      log.appendChild(wrapEl);
      scrollToBottom();

      const seed = Math.floor(Math.random() * 1_000_000_000);
      const params = new URLSearchParams({
        width: '1024', height: '1024', seed: String(seed),
        nologo: 'true', enhance: 'true',
      });
      const url = IMAGE_ENDPOINT + encodeURIComponent(finalPrompt) + '?' + params;

      const img = new Image();
      img.classList.add('gen-image');
      img.alt = finalPrompt;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';

      img.onload = () => {
        bubble.innerHTML = '';
        if (enhanced && enhanced !== userPrompt) {
          const info = document.createElement('div');
          info.className = 'enhance-info';
          info.innerHTML =
            '<div class="orig"><strong>You:</strong> ' + escapeHtml(userPrompt) + '</div>' +
            '<div style="margin-top:4px"><strong>✨ Claude:</strong> ' + escapeHtml(enhanced) + '</div>';
          bubble.appendChild(info);
        }
        const imgWrap = document.createElement('div');
        imgWrap.className = 'gen-image-wrap';
        imgWrap.appendChild(img);

        const actions = document.createElement('div');
        actions.className = 'gen-image-actions';
        const dl = document.createElement('a');
        dl.href = url; dl.download = `grokky-${Date.now()}.jpg`; dl.target = '_blank'; dl.rel = 'noopener';
        dl.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>Download`;
        actions.appendChild(dl);

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy URL`;
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(url);
            copyBtn.classList.add('ok'); copyBtn.lastChild.textContent = 'Copied';
            setTimeout(() => { copyBtn.classList.remove('ok'); copyBtn.lastChild.textContent = 'Copy URL'; }, 1500);
          } catch { showToast('Copy failed'); }
        });
        actions.appendChild(copyBtn);

        const open = document.createElement('a');
        open.href = url; open.target = '_blank'; open.rel = 'noopener';
        open.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>Open`;
        actions.appendChild(open);

        const remix = document.createElement('button');
        remix.type = 'button';
        remix.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>New seed`;
        remix.addEventListener('click', () => {
          wrapEl.remove();
          generateImageFromFinal(userPrompt, finalPrompt, enhanced);
        });
        actions.appendChild(remix);

        imgWrap.appendChild(actions);
        const caption = document.createElement('div');
        caption.className = 'gen-caption';
        caption.textContent = `"${finalPrompt}"`;
        imgWrap.appendChild(caption);
        bubble.appendChild(imgWrap);
        if (isAtBottom()) scrollToBottom(false);
      };

      img.onerror = () => {
        wrapEl.classList.remove('assistant');
        wrapEl.classList.add('error');
        bubble.innerHTML = '';
        bubble.textContent = 'Image generation failed. Pollinations may be busy — try again in a moment.';
      };
      img.src = url;
    }

    // Tiny HTML escaper for the enhance-info display (the prompt is user input).
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    function humanizeError(err) {
      const msg = err?.message || String(err);
      if (msg.includes('Failed to fetch') || msg.includes('NetworkError')) {
        return 'Network problem — check your connection and try again.';
      }
      if (msg.includes('429')) return 'Rate limited — wait a few seconds and try again.';
      if (msg.includes('500') || msg.includes('502') || msg.includes('503')) {
        return 'Pollinations server is busy. Try again in a moment.';
      }
      return `Error: ${msg}`;
    }

    /* ============== Composer ============== */
    function autosize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    }
    input.addEventListener('input', autosize);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (abortCtrl) {
        abortCtrl.abort();
        return;
      }
      const text = input.value;
      if (!text.trim()) return;
      input.value = '';
      autosize();
      if (mode === 'image') generateImage(text);
      else sendMessage(text);
    });

    /* Message-level actions */
    log.addEventListener('click', async (e) => {
      const btn = e.target.closest('.msg-action');
      if (!btn) return;
      const msgEl = btn.closest('.msg');
      const idx = [...log.querySelectorAll('.msg')].indexOf(msgEl);
      if (idx < 0) return;
      const act = btn.dataset.act;

      if (act === 'copy') {
        const text = history[idx]?.content ?? msgEl.querySelector('.bubble')?.innerText ?? '';
        try {
          await navigator.clipboard.writeText(text);
          btn.classList.add('ok'); btn.lastChild.textContent = ' Copied';
          setTimeout(() => { btn.classList.remove('ok'); btn.lastChild.textContent = ' Copy'; }, 1500);
        } catch { showToast('Copy failed'); }
      } else if (act === 'regenerate') {
        if (history[idx]?.role !== 'assistant') return;
        history.splice(idx, 1);
        msgEl.remove();
        saveHistory();
        if (history.some(m => m.role === 'user')) await regenerateLast();
      }
    });

    clearBtn.addEventListener('click', () => {
      if (abortCtrl) abortCtrl.abort();
      if (history.length && !confirm('Start a new chat? This clears the current conversation.')) return;
      history = [];
      saveHistory();
      rerenderAll();
      input.focus();
    });

    /* ============== Boot ============== */
    history = loadHistory();
    rerenderAll();
    autosize();
    input.focus();

    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', () => {
        if (isAtBottom()) scrollToBottom(false);
      });
    }
  </script>
</body>
</html>
